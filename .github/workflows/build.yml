name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          combine: true

  package:
    name: Package combined .geode
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-perfect-counter
          path: ./build/output/*.geode
